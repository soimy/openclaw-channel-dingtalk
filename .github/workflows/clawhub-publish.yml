name: Publish to ClawHub

# The publish itself runs through OpenClaw's reusable workflow
# `openclaw/clawhub/.github/workflows/package-publish.yml`, which checks out the
# ClawHub repository, installs it with Bun and runs the CLI from source.
#
# Why not `npm install -g clawhub@<x>` here: the npm dist-tag is still 0.23.3
# (2026-08-04) while the ClawHub repository already carries 0.24.0. The older
# client does not read `Retry-After`, so a throttled publish retries blind until
# its 120s request timeout, which is exactly how the v3.9.0 tag run failed twice
# on 2026-10-17. The reusable workflow also speaks the staged-upload and
# publication-state protocol the server moved to.
#
# Publishing is not gated on a ClawHub security audit. Run the audit first when
# you want a verdict: `.github/workflows/clawhub-audit.yml` (manual dispatch) or
# `scripts/clawhub-audit-local.mjs` (local tree).
#
# PINNED_REUSABLE_WORKFLOW_SHA: one reviewed upstream commit. Bump it
# deliberately when ClawHub changes the publish protocol; `@main` would let an
# unreviewed upstream commit run with this repository's CLAWHUB_TOKEN.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing git tag to publish, for example v3.9.0.
                required: true
                type: string
    push:
        tags:
            - "*"

permissions:
    contents: read

concurrency:
    group: clawhub-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read

        outputs:
            release_commit: ${{ steps.release.outputs.release_commit }}
            source_ref: ${{ steps.release.outputs.source_ref }}
            clawhub_tag: ${{ steps.release.outputs.clawhub_tag }}
            tarball_name: ${{ steps.pack.outputs.tarball_name }}

        steps:
            - name: Checkout the release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve the release commit and verify the version
              id: release
              shell: bash
              env:
                  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail

                  TAG="${TARGET_REF}"
                  if [[ -z "${TAG}" ]]; then
                    echo "::error::A tag is required. Set the 'tag' input or push a tag."
                    exit 1
                  fi

                  # Re-read the tag from the remote instead of trusting the local
                  # checkout, then peel it: an annotated tag resolves to a tag
                  # object, so `^{commit}` is what makes the comparison meaningful.
                  git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
                  RELEASE_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
                  CHECKOUT_COMMIT="$(git rev-parse HEAD)"

                  if [[ "${RELEASE_COMMIT}" != "${CHECKOUT_COMMIT}" ]]; then
                    echo "::error::Checked out ${CHECKOUT_COMMIT} but tag ${TAG} points at ${RELEASE_COMMIT}; refusing to publish a tree that does not match the tag."
                    exit 1
                  fi

                  RAW_VERSION="${TAG#v}"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [[ "${RAW_VERSION}" != "${PACKAGE_VERSION}" ]]; then
                    echo "Tag version and package version are not synchronized."
                    echo "tag: ${TAG}"
                    echo "expected package.json version: ${RAW_VERSION}"
                    echo "actual package.json version: ${PACKAGE_VERSION}"
                    exit 1
                  fi

                  CLAWHUB_TAG="latest"
                  if [[ "${RAW_VERSION}" =~ -beta(\.|$) ]]; then
                    CLAWHUB_TAG="beta"
                  fi

                  echo "release_commit=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"
                  echo "source_ref=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "clawhub_tag=${CLAWHUB_TAG}" >> "$GITHUB_OUTPUT"
                  echo "Version check passed: ${TAG} -> ${PACKAGE_VERSION} (ClawHub tag: ${CLAWHUB_TAG})"
                  echo "Release commit: ${RELEASE_COMMIT}"

            - name: Type check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint

            - name: Run tests
              run: pnpm test

            - name: Build runtime package
              run: pnpm run build

            - name: Verify package runtime output
              run: pnpm run pack:check

            # The reusable workflow publishes the artifact instead of packing a
            # checkout, so the ClawHub runner never has to run our pnpm build.
            # `--ignore-scripts` is safe: `pack:check` above already packed and
            # asserted this exact tree, so prepack would only rebuild it.
            - name: Pack the release tarball
              id: pack
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "${RUNNER_TEMP}/clawpack"
                  npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/clawpack" > /dev/null
                  TARBALL="$(find "${RUNNER_TEMP}/clawpack" -maxdepth 1 -name '*.tgz' -type f)"
                  if [[ -z "${TARBALL}" ]]; then
                    echo "::error::npm pack produced no tarball."
                    exit 1
                  fi
                  # Keep npm's own file name: the CLI inspects the tarball it is
                  # given, and a renamed archive is an avoidable unknown. The name
                  # travels to the publish job as an output instead.
                  echo "tarball_name=$(basename "${TARBALL}")" >> "$GITHUB_OUTPUT"
                  echo "Packed $(basename "${TARBALL}") for the ClawHub publish."

            - name: Upload the release tarball
              uses: actions/upload-artifact@v4
              with:
                  name: clawhub-clawpack
                  if-no-files-found: error
                  retention-days: 7
                  path: ${{ runner.temp }}/clawpack/${{ steps.pack.outputs.tarball_name }}

    publish:
        needs: verify
        # `actions: read` is what lets the called workflow download the tarball
        # this run uploaded; `id-token: write` is required because the reusable
        # workflow resolves and re-checks its own source through GitHub OIDC.
        permissions:
            actions: read
            contents: read
            id-token: write
        uses: openclaw/clawhub/.github/workflows/package-publish.yml@1d2eadf6c8438c6e97028590382a252f47bb4adb
        with:
            package_artifact_name: clawhub-clawpack
            package_artifact_path: ${{ needs.verify.outputs.tarball_name }}
            # `dry_run` defaults to true upstream: without this the publish would
            # be a preview and the job would still go green.
            dry_run: false
            wait_for_publication: true
            # Upstream caps this at 40: its job leaves 35 minutes for setup,
            # upload and output capture. Anything above 40 is rejected.
            publication_timeout_minutes: 40
            tags: ${{ needs.verify.outputs.clawhub_tag }}
            source_repo: ${{ github.repository }}
            source_commit: ${{ needs.verify.outputs.release_commit }}
            source_ref: ${{ needs.verify.outputs.source_ref }}
        secrets:
            # Kept for tag pushes and first publishes; the reusable workflow can
            # fall back to OIDC trusted publishing, but docs describe tag-push
            # real publishes as still needing a token.
            clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
